<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#13294B"/>
    </marker>
  </defs>

  <!-- Role 1 -->
  <rect x="10" y="20" width="290" height="120" rx="10" fill="#4B9CD3" stroke="#13294B" stroke-width="2"/>
  <text x="155" y="50" text-anchor="middle" fill="#13294B" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" letter-spacing="1.2">ROLE 1 · DATA GENERATOR</text>
  <text x="155" y="84" text-anchor="middle" fill="white" font-family="Instrument Serif, serif" font-size="28">Daktari Dx</text>
  <text x="155" y="116" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">Expert validation of synthetic data</text>

  <!-- Role 2 -->
  <rect x="315" y="20" width="290" height="120" rx="10" fill="#13294B" stroke="#13294B" stroke-width="2"/>
  <text x="460" y="50" text-anchor="middle" fill="#7BB8E0" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" letter-spacing="1.2">ROLE 2 · SUBJECT OF STUDY</text>
  <text x="460" y="84" text-anchor="middle" fill="white" font-family="Instrument Serif, serif" font-size="28">AugMed</text>
  <text x="460" y="116" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">Contested: clinical vs. economic</text>

  <!-- Role 3 -->
  <rect x="620" y="20" width="290" height="120" rx="10" fill="#059669" stroke="#13294B" stroke-width="2"/>
  <text x="765" y="50" text-anchor="middle" fill="#13294B" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" letter-spacing="1.2">ROLE 3 · ELICITATION INFRA</text>
  <text x="765" y="84" text-anchor="middle" fill="white" font-family="Instrument Serif, serif" font-size="28">Sentinel</text>
  <text x="765" y="116" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">Dispersed judgment, aggregated</text>

  <!-- Converging arrows -->
  <path d="M155 140 C155 215 460 205 460 273" stroke="#13294B" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M460 140 L460 273" stroke="#13294B" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M765 140 C765 215 460 205 460 273" stroke="#13294B" stroke-width="3" fill="none" marker-end="url(#ah)"/>

  <!-- Spine box -->
  <rect x="60" y="285" width="800" height="95" rx="10" fill="#D97706" stroke="#13294B" stroke-width="2"/>
  <text x="460" y="322" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="15" font-weight="600" letter-spacing="1">WHEN GROUND TRUTH IS SCARCE OR CONTESTED</text>
  <text x="460" y="358" text-anchor="middle" fill="white" font-family="Instrument Serif, serif" font-size="27">elicit &#183; validate &#183; aggregate expert judgment</text>
</svg>
