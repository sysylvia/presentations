<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#13294B"/>
    </marker>
  </defs>

  <!-- Patient case -->
  <rect x="20" y="125" width="190" height="110" rx="10" fill="#4B9CD3" stroke="#13294B" stroke-width="2"/>
  <text x="115" y="170" text-anchor="middle" fill="white" font-family="Instrument Serif, serif" font-size="24">Patient case</text>
  <text x="115" y="200" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">features randomized</text>

  <!-- Arm: Physician + AI -->
  <rect x="345" y="35" width="225" height="95" rx="10" fill="#13294B" stroke="#13294B" stroke-width="2"/>
  <text x="457" y="78" text-anchor="middle" fill="white" font-family="Instrument Serif, serif" font-size="24">Physician + AI</text>
  <text x="457" y="106" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">AI recommendation shown</text>

  <!-- Arm: Physician alone -->
  <rect x="345" y="230" width="225" height="95" rx="10" fill="#64748B" stroke="#13294B" stroke-width="2"/>
  <text x="457" y="273" text-anchor="middle" fill="white" font-family="Instrument Serif, serif" font-size="24">Physician alone</text>
  <text x="457" y="301" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">AI recommendation withheld</text>

  <!-- Measure -->
  <rect x="700" y="110" width="200" height="140" rx="10" fill="#059669" stroke="#13294B" stroke-width="2"/>
  <text x="800" y="148" text-anchor="middle" fill="white" font-family="Instrument Serif, serif" font-size="24">Measure</text>
  <text x="800" y="178" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">complementarity</text>
  <text x="800" y="200" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">asymmetric reliance</text>
  <text x="800" y="222" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13">heterogeneous response</text>

  <!-- Split arrows (randomize AI exposure) -->
  <path d="M210 180 C270 180 280 83 343 83" stroke="#13294B" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M210 180 C270 180 280 278 343 278" stroke="#13294B" stroke-width="3" fill="none" marker-end="url(#ah)"/>

  <!-- Merge arrows into Measure -->
  <path d="M570 83 C630 83 645 175 698 175" stroke="#13294B" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M570 278 C630 278 645 185 698 185" stroke="#13294B" stroke-width="3" fill="none" marker-end="url(#ah)"/>

  <!-- Randomization label -->
  <rect x="232" y="12" width="246" height="30" rx="6" fill="#D97706"/>
  <text x="355" y="32" text-anchor="middle" fill="white" font-family="Source Sans 3, sans-serif" font-size="13" font-weight="600">RANDOMIZE: AI exposure</text>
</svg>
